# E4 scenario S1: one reproducible sidewalk with a cross-slope, a heaved slab, an uphill grade and a
# curb drop to the road on the right (y < -1.5). Scene frame = `sidewalk` family (x -1..13, y -1.5..1.5).
# No cylinders: S1 tests traversal only. Features are kept away from the start (|x| < 1).
_base_: isaac_go2_rough.yaml
isaac:
  families: [sidewalk]
  scene_obstacles: false
  terrain:
    width: 3.0
    cross_slope: 0.04            # 4 % (ADA allows 2 %)
    slabs: [[4.0, 1.5, 0.08]]    # 8 cm heaved slab from x = 4.0 to 5.5
    grade: [[7.0, 10.0, 0.06]]   # 6 % uphill from x = 7 to 10 (+0.18 m), level after
    curb_drop: 0.15              # 15 cm curb down to the road at y < -1.5
    friction: 1.0
